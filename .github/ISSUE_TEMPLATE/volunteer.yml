name: Volunteer application
description: Tell us what you are good at and what you care about, so we can point you at functions that fit.
title: "Volunteer: "
labels: ["volunteer"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public, and so is everything you write in it. Do not put an email
        address, a phone number or any other private contact detail here — your GitHub
        account is already the way we reach you.

        You do not need to know the whole system to contribute to it. That is the point
        of the protocol.
  - type: checkboxes
    id: skills
    attributes:
      label: Where you can help
      description: Pick anything that fits. "Not sure yet" is a real answer.
      options:
        - label: Code
        - label: Research
        - label: Design
        - label: Documentation
        - label: Translation
        - label: Governance
        - label: Outreach
        - label: Not sure yet
  - type: dropdown
    id: hours
    attributes:
      label: Hours a week you can give
      description: There is no obligation of hours — functions are sized so that finishing one is always possible.
      options:
        - "1–3"
        - "4–8"
        - "9–15"
        - "15+"
  - type: textarea
    id: why
    attributes:
      label: What draws you to Drayker?
      description: A problem you want solved, a project you already follow, a paper you disagreed with.
      placeholder: Anything concrete helps more than a résumé.
  - type: input
    id: languages
    attributes:
      label: Languages you work in
      description: Optional. Useful for translation and for review across communities.
