name: Open function
description: Publish a piece of work small enough for one person to finish.
title: "Function: "
labels: ["proposed-function"]
body:
  - type: markdown
    attributes:
      value: |
        An issue becomes an open function when it is small enough for one person to
        complete and defined enough that its result composes with the rest. This form
        labels the issue `proposed-function`. A maintainer reviews the proposal and
        applies `open-function`; only reviewed functions appear on the board at
        [drayker.org/#org/fn](https://drayker.org/#org/fn), and nothing on that board
        is written by hand.

        Suggest labels in this issue so the function reaches the right people:
        `skill:code`, `skill:research`, `skill:design`, `skill:docs` or
        `skill:governance`, plus `level:entry` / `level:intermediate` /
        `level:advanced` and an `effort:~4h`-style hour estimate if you can make one.
        A maintainer applies them. An issue too large for one person to finish has
        to be fragmented before it is an open function.
  - type: textarea
    id: outcome
    attributes:
      label: What is delivered
      description: The finished thing, described so that someone else can tell when it is done.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Why it is needed
      description: Which requirement, paper or gap this function comes from. Link the source.
    validations:
      required: true
  - type: textarea
    id: start
    attributes:
      label: Where to start
      description: Files, documents or prior discussion someone should read first.
  - type: input
    id: review
    attributes:
      label: Who reviews it
      description: Optional. A person, a relevant maintainer, or another contributor who can review the result before merge to master.
