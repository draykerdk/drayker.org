name: Organization snapshot

# Commits data/org.json so the portal renders the board without a single API call at
# page load: repositories, open issues and contributors, as they were at the last run.
# The site prefers this file and only uses the live API to refresh it — with the API
# blocked or rate-limited, the snapshot is what the reader sees.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build data/org.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p data

          gh api 'orgs/draykerdk/repos?per_page=100&sort=updated' > /tmp/repos.json
          # The repository issues endpoint also returns pull requests. Query every
          # public component repository and discard objects carrying `pull_request`
          # explicitly; relying on a search qualifier previously put a PR on the
          # volunteers' open-functions board.
          while IFS= read -r r; do
            file="/tmp/i-$(echo "$r" | tr '/' '-').json"
            gh api "repos/$r/issues?state=open&per_page=100" > "$file"
          done < <(jq -r '.[] | select(.archived == false and .name != ".github") | .full_name' /tmp/repos.json)
          jq -s 'add | map(select(has("pull_request") | not)) | sort_by(.updated_at) | reverse' \
            /tmp/i-*.json > /tmp/issues.json

          # Contributors of the four most recently pushed repositories, same as the site.
          echo '[]' > /tmp/people.json
          # Each contributor carries the repository it came from, because the portal
          # renders `repos` as a label. Dropping it here shipped a snapshot the
          # component could not render at all on a first visit.
          for r in $(jq -r '[.[] | select(.archived == false and .name != ".github")] | sort_by(.pushed_at) | reverse | .[0:4] | .[].full_name' /tmp/repos.json); do
            file="/tmp/c-$(echo "$r" | tr '/' '-').json"
            gh api "repos/$r/contributors?per_page=10" \
              | jq --arg n "${r#*/}" 'map(. + {repo: $n})' > "$file" || echo '[]' > "$file"
          done
          jq -s 'add | map(select(.type != "Bot"))
                 | group_by(.login)
                 | map({login: .[0].login, avatar: .[0].avatar_url, url: .[0].html_url,
                        n: (map(.contributions) | add),
                        repos: (map(.repo) | unique)})
                 | sort_by(-.n) | .[0:12]' /tmp/c-*.json > /tmp/people.json

          jq -n \
            --slurpfile repos /tmp/repos.json \
            --slurpfile issues /tmp/issues.json \
            --slurpfile people /tmp/people.json \
            --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              generated_at: $at,
              source: "github api, committed by .github/workflows/org-snapshot.yml",
              repos: [$repos[0][] | select(.archived == false and .name != ".github") | {
                name, full: .full_name, desc: (.description // ""), lang: (.language // ""),
                stars: .stargazers_count, forks: .forks_count, issues: .open_issues_count,
                url: .html_url, home: (.homepage // ""), push: .pushed_at }],
              issues: [$issues[0][]? | {
                num: .number, title, url: .html_url,
                repo: (.repository_url | split("/") | last),
                labels: [.labels[]?.name | ascii_downcase],
                user: (.user.login // ""), avatar: (.user.avatar_url // ""),
                comments: (.comments // 0), at: .updated_at,
                assigned: ((.assignees | length) > 0) }],
              people: $people[0]
            }' > /tmp/org.json

          # A scheduled token can occasionally see the organization but return no
          # repository issues or contributors. Treat that as an API failure, not as
          # a real empty board: a zeroed snapshot would erase every open function
          # from the public portal until a maintainer noticed the pull request.
          next_repos=$(jq '.repos | length' /tmp/org.json)
          next_issues=$(jq '.issues | length' /tmp/org.json)
          next_people=$(jq '.people | length' /tmp/org.json)
          current_issues=$(jq '.issues | length' data/org.json 2>/dev/null || echo 0)
          current_people=$(jq '.people | length' data/org.json 2>/dev/null || echo 0)
          if [ "$next_repos" -lt 24 ]; then
            echo "refusing incomplete snapshot: only $next_repos repositories" >&2
            exit 1
          fi
          if [ "$current_issues" -gt 0 ] && [ "$next_issues" -eq 0 ]; then
            echo "refusing empty issue snapshot: current record has $current_issues" >&2
            exit 1
          fi
          if [ "$current_people" -gt 0 ] && [ "$next_people" -eq 0 ]; then
            echo "refusing empty contributor snapshot: current record has $current_people" >&2
            exit 1
          fi

          # Keep the committed timestamp stable when the public data did not change.
          # Otherwise the workflow would open a content-free update every day.
          if [ -f data/org.json ] && jq -e -s '
            (.[0] | del(.generated_at, .source)) ==
            (.[1] | del(.generated_at, .source))
          ' data/org.json /tmp/org.json >/dev/null; then
            echo 'snapshot unchanged'
          else
            cp /tmp/org.json data/org.json
          fi

          jq -e 'all(.issues[]; (.url | test("/issues/[0-9]+$")))' data/org.json >/dev/null
          # The board reads person.repos directly — never publish a person without it.
          jq -e 'all(.people[]; (.repos | type) == "array")' data/org.json >/dev/null
          jq -r '"repos: \(.repos | length) · issues: \(.issues | length) · people: \(.people | length)"' data/org.json

      - name: Commit if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- data/org.json; then
            echo "no change"
            exit 0
          fi
          git config user.name  'drayker-snapshot'
          git config user.email 'actions@users.noreply.github.com'
          branch='automation/org-snapshot'
          git switch -C "$branch"
          git add data/org.json
          git commit -m "data: organization snapshot $(date -u +%Y-%m-%d)"
          git push --force origin "HEAD:$branch"

          # Keep this change behind the protected-branch contract. GitHub may require a
          # maintainer to approve the check on a pull request opened by github-actions;
          # auto-merge then lands it as soon as that check passes. Do not bypass the
          # ruleset or push the snapshot directly to master.
          pr=$(gh pr list --head "$branch" --base master --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            pr=$(gh pr create \
              --base master \
              --head "$branch" \
              --title 'data: refresh organization snapshot' \
              --body 'Automated public GitHub snapshot for the static volunteers portal. Merges itself once the component-contract check passes.' \
              | grep -oE '[0-9]+$')
          fi
          gh pr merge "$pr" --squash --auto
